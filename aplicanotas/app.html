<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AplicaNotas — Mis notas</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><meta name="theme-color" content="#111827"><style>.shell{max-width:1120px;margin:auto;padding:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.toolbar input{flex:1;min-width:220px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer;background:#111827;color:white}.btn.alt{background:white;color:#111827;border:1px solid var(--line)}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.note{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;min-height:170px;cursor:pointer;position:relative}.note h3{margin:0 0 10px}.note p{white-space:pre-wrap;color:#475569}.empty{text-align:center;padding:90px 20px;color:#64748b}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px}.modal.open{display:grid}.editor{width:min(680px,100%);background:white;border-radius:22px;padding:22px}.editor input,.editor textarea{width:100%;border:0;outline:none;font:inherit}.editor input{font-size:28px;font-weight:900;margin-bottom:14px}.editor textarea{min-height:280px;resize:vertical;line-height:1.5}.editorbar{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.danger{background:#fff;border:1px solid #ef4444;color:#b91c1c}@media(max-width:850px){.notes{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.notes{grid-template-columns:1fr}}</style></head><body><div class="shell"><header class="top" style="padding-left:0;padding-right:0"><a class="brand" href="index.html"><span class="dot"></span>AplicaNotas</a><button id="theme" class="btn alt">☾</button></header><div class="toolbar"><input id="search" placeholder="Buscar notas…"><button id="new" class="btn">+ Nueva nota</button><button id="export" class="btn alt">Exportar</button><label class="btn alt" style="cursor:pointer">Importar<input id="import" type="file" accept="application/json" hidden></label></div><div id="notes" class="notes"></div></div><div id="modal" class="modal"><div class="editor"><input id="title" placeholder="Título"><textarea id="body" placeholder="Escribe aquí…"></textarea><div class="editorbar"><button id="delete" class="btn danger">Eliminar</button><button id="close" class="btn">Guardar y cerrar</button></div></div></div><script src="app.js"></script></body></html>
