<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notas Express — Demo</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><style>.app{max-width:1060px;margin:auto;padding:22px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.bar input{flex:1;min-width:220px;border:1px solid var(--line);background:white;padding:14px;border-radius:13px;font:inherit}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:850;background:#161616;color:white;cursor:pointer}.btn.alt{background:white;color:#161616;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.note{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;min-height:170px;cursor:pointer}.note.pinned{outline:3px solid #161616}.note h3{margin:0 0 8px}.note p{white-space:pre-wrap;color:#5d5a54}.empty{padding:80px 20px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px}.modal.open{display:grid}.editor{width:min(680px,100%);background:#fffdf7;border-radius:22px;padding:22px}.editor input,.editor textarea{width:100%;border:0;outline:0;background:transparent;font:inherit}.editor input{font-size:28px;font-weight:900;margin-bottom:12px}.editor textarea{min-height:250px;resize:vertical;line-height:1.5}.editbar{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.colors{display:flex;gap:7px}.sw{width:28px;height:28px;border-radius:50%;border:2px solid #ddd;cursor:pointer}.danger{background:white;color:#b42318;border:1px solid #f0aaa4}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><header class="nav" style="padding:0"><a class="brand" href="index.html">Notas<span>Express</span></a><button id="theme" class="btn alt">☾</button></header><div class="bar"><input id="search" placeholder="Buscar notas…"><button id="new" class="btn">+ Nueva</button><button id="export" class="btn alt">Exportar</button></div><div id="grid" class="grid"></div></div><div id="modal" class="modal"><div class="editor"><input id="title" placeholder="Título"><textarea id="body" placeholder="Escribe aquí…"></textarea><div class="editbar"><div class="colors"><button class="sw" data-c="#ffffff" style="background:#fff"></button><button class="sw" data-c="#fff0a6" style="background:#fff0a6"></button><button class="sw" data-c="#d8ff66" style="background:#d8ff66"></button><button class="sw" data-c="#d9ecff" style="background:#d9ecff"></button><button class="sw" data-c="#ffd8e8" style="background:#ffd8e8"></button></div><div><button id="pin" class="btn alt">Fijar</button> <button id="delete" class="btn danger">Eliminar</button> <button id="close" class="btn">Cerrar</button></div></div></div></div><script src="app.js"></script></body></html>
